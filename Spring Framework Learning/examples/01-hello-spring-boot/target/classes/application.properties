# Application Configuration
app.welcome.message=Welcome to Spring Boot Learning!
app.version=1.0.0

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Logging Configuration
logging.level.com.example.hello=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Application Information for Actuator
info.app.name=Hello Spring Boot
info.app.description=A simple Spring Boot application for learning
info.app.version=1.0.0
info.app.java.version=17.0.16